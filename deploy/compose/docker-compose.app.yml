# The reference deployment: database, blob storage, server and worker.
#
# Separate from `docker-compose.yml`, which starts only the two backing services a developer
# needs for `pnpm test`. Mixing them would mean every test run pulls an application image.
#
#   docker compose -f deploy/compose/docker-compose.yml \
#                  -f deploy/compose/docker-compose.app.yml up -d
#
name: veritymem-app

services:
  server:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.server
    image: veritymem-server:0.1.0
    container_name: veritymem-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://veritymem_app:veritymem_app@postgres:5432/veritymem
      MIGRATION_DATABASE_URL: postgres://verity:verity@postgres:5432/veritymem
      HOST: 0.0.0.0
      PORT: "8787"
      # The lexical stand-in, explicitly. Switching this to `onnx` requires the mounted model
      # below, and the server will refuse to start without it rather than weaken the gate.
      GATE_ENTAILMENT_BACKEND: lexical
      EMBEDDING_BACKEND: hash
    ports:
      - "8787:8787"
    volumes:
      # Provision the production entailment verifier with:
      #   node scripts/fetch-model.mjs
      # then set GATE_ENTAILMENT_BACKEND=onnx. The mount is read-only: the server never
      # writes to its own model assets.
      - ../../.veritymem/models:/app/.veritymem/models:ro
    command:
      - sh
      - -c
      - "node --experimental-strip-types scripts/migrate.ts && node --experimental-strip-types apps/server/src/main.ts"

  worker:
    image: veritymem-server:0.1.0
    container_name: veritymem-worker
    depends_on:
      server:
        condition: service_started
    environment:
      DATABASE_URL: postgres://veritymem_app:veritymem_app@postgres:5432/veritymem
      MIGRATION_DATABASE_URL: postgres://verity:verity@postgres:5432/veritymem
      # Required: a worker that claims from every tenant would pick up another deployment's
      # queue, and a backlog in one tenant would starve the rest.
      WORKER_TENANT_SLUGS: ${WORKER_TENANT_SLUGS:?set WORKER_TENANT_SLUGS to a comma-separated tenant list}
      GATE_ENTAILMENT_BACKEND: lexical
      EMBEDDING_BACKEND: hash
    volumes:
      - ../../.veritymem/models:/app/.veritymem/models:ro
      - veritymem_blobs:/app/.veritymem/blobs
    command: ["node", "--experimental-strip-types", "apps/worker/src/main.ts"]

volumes:
  veritymem_blobs:
