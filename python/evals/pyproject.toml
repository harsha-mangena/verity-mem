[project]
name = "veritymem-evals"
version = "0.1.0"
description = "Offline evaluation harness for VerityMem. Never on the online path."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
veritymem-eval-report = "veritymem_evals.report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veritymem_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
